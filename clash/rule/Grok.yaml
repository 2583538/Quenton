    filter: "(?i)(🇹🇼|台湾|台灣|台|臺|Taiwan|Taipei|(^|[^A-Za-z])TWN?($|[^A-Za-z]))"
  - name: 国外DNS
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Server.png
    proxies:
      - 全局
      - 负载均衡
