proxy-groups:
  - name: 全局
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
    proxies:
      - 延迟最低
      - 负载均衡
      - 故障切换
      - 手动切换
      - DIRECT
  - name: 手动切换
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png
    include-all: true
  - name: 延迟最低
    type: url-test
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all: true
  - name: 负载均衡
    type: load-balance
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png
    strategy: consistent-hashing
    url: http://www.gstatic.com/generate_204
    interval: 300
    include-all: true
  - name: 故障切换
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bypass.png
    url: http://www.gstatic.com/generate_204
    interval: 300
    include-all: true
  # 新增 AI测速 节点组 (自动测速 + 正则筛选 Super 美国)
  - name: AI测速
    type: url-test
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bot.png
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all: true
    filter: "(?i)Super.*美"
  - name: 测速美国
    type: url-test
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/US.png
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all: true
    filter: "(?i)(🇺🇸|美国|美國|United[ _-]?States|America|洛杉矶|洛杉磯|Los[ _-]?Angeles|San[ _-]?Jose|Seattle|New[ _-]?York|(^|[^A-Za-z])USA?($|[^A-Za-z]))"
  - name: 测速香港
    type: url-test
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/HK.png
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all: true
    filter: "(?i)(🇭🇰|香港|Hong[ _-]?Kong|(^|[^A-Za-z])HKG?($|[^A-Za-z]))"
  - name: 测速台湾
    type: url-test
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TW.png
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all: true
    filter: "(?i)(🇹🇼|台湾|台灣|台|臺|Taiwan|Taipei|(^|[^A-Za-z])TWN?($|[^A-Za-z]))"
  - name: 手动美国
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/US.png
    include-all: true
    filter: "(?i)(🇺🇸|美国|美國|United[ _-]?States|America|洛杉矶|洛杉磯|Los[ _-]?Angeles|San[ _-]?Jose|Seattle|New[ _-]?York|(^|[^A-Za-z])USA?($|[^A-Za-z]))"
    proxies:
      - DIRECT
      - REJECT
  - name: 手动香港
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/HK.png
    include-all: true
    filter: "(?i)(🇭🇰|香港|Hong[ _-]?Kong|(^|[^A-Za-z])HKG?($|[^A-Za-z]))"
    proxies:
      - DIRECT
      - REJECT
  - name: 手动台湾
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TW.png
    include-all: true
    filter: "(?i)(🇹🇼|台湾|台灣|台|臺|Taiwan|Taipei|(^|[^A-Za-z])TWN?($|[^A-Za-z]))"
    proxies:
      - DIRECT
      - REJECT
  - name: 花园美国
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/US.png
    use:
      - flower
    filter: "(?i)(🇺🇸|美国|美國|United[ _-]?States|America|洛杉矶|洛杉磯|Los[ _-]?Angeles|San[ _-]?Jose|Seattle|New[ _-]?York|(^|[^A-Za-z])USA?($|[^A-Za-z]))"
  - name: 花园香港
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/HK.png
    use:
      - flower
    filter: "(?i)(🇭🇰|香港|Hong[ _-]?Kong|(^|[^A-Za-z])HKG?($|[^A-Za-z]))"
  - name: 花园台湾
    type: select
